name: image

# Why this exists: a cluster and a Docker Compose host get the institution
# folder as an image. A pull request checks that the image builds and that
# it gives the folder. A version tag publishes it.
"on":
  pull_request:
  push:
    branches: [main]
    tags: ["v*.*.*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: The folder must give theme.conf
        run: test -s institution/theme.conf
      - name: Build
        run: docker build -t institution .
      # The copy is the whole contract of the image: run it with the limits
      # of the frontend pod (read-only root, no capability, an arbitrary
      # user), and compare the result with the folder.
      - name: The image must copy the folder to /out
        run: |
          mkdir out && chmod 777 out
          echo stale > out/removed-file
          docker run --rm --read-only --cap-drop ALL --user 12345:0 \
            -v "$PWD/out:/out" institution
          diff -r institution out

  publish:
    name: Publish the image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Log in to ghcr.io
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      # The git tag is the image tag, v1.1.0, like the app images. Two
      # platforms, because a cluster node and a laptop can differ.
      - name: Build and push
        run: |
          image="ghcr.io/$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          docker buildx create --use
          docker buildx build --platform linux/amd64,linux/arm64 \
            --tag "${image}:${GITHUB_REF_NAME}" --push .
